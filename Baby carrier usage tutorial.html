<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内容展示</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#f5f5f5;padding:10px;display:flex;flex-direction:column;align-items:center;gap:15px}
  .video-box{width:100%;max-width:600px}
  video{width:100%;border-radius:8px}
  .img-box{width:100%;max-width:600px}
  img{width:100%;border-radius:8px}
</style>
</head>

<body>
  <!-- 视频区域 -->
  <div class="video-box">
    <video src="https://你的视频地址.mp4" controls></video>
  </div>

  <!-- 图片区域 -->
  <div class="img-box">
    <img src="https://res.cloudinary.com/dagbuvebo/image/upload/v1776749109/Cuoritmo_Baby_Carriers_v6f3fo.png">
  </div>
</body>
</html>
